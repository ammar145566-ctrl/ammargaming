<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ammargaming | كل روابطي</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; font-family:Arial,Tahoma,sans-serif;
      color:#fff; display:flex; justify-content:center; padding:28px 16px;
      background:#050507 url("background.png") center center / cover fixed no-repeat;
      position:relative;
    }
    body:before{
      content:""; position:fixed; inset:0; background:rgba(0,0,0,.34);
      z-index:0; pointer-events:none;
    }
    .wrap{width:min(520px,100%); text-align:center; position:relative; z-index:1}
    .brand{
      margin:5px auto 18px; padding:14px 20px; width:max-content; max-width:100%;
      border-radius:18px; background:rgba(0,0,0,.58); border:1px solid rgba(255,255,255,.15);
      backdrop-filter:blur(7px); box-shadow:0 10px 30px #0008;
    }
    h1{margin:0;font-size:30px;text-shadow:0 3px 12px #000}
    .bio{
      margin:9px 0 24px;color:#fff;font-size:15px;font-weight:700;
      text-shadow:0 2px 8px #000;
    }
    .links{display:grid;gap:12px}
    a{
      text-decoration:none;color:white;background:rgba(10,10,15,.78);
      border:1px solid rgba(255,255,255,.18); padding:17px 20px;border-radius:16px;
      font-size:17px;font-weight:700; transition:.18s; box-shadow:0 8px 24px #0009;
      backdrop-filter:blur(7px);
    }
    a:hover{transform:translateY(-2px);border-color:#e00000;background:rgba(25,10,12,.9)}
    .note{
      margin-top:22px;color:#fff;font-size:12px;text-shadow:0 2px 7px #000;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand">
      <h1>Ammargaming</h1>
      <div class="bio">كل حساباتي وروابطي في مكان واحد 🎮</div>
    </div>
    <section class="links">
      <a href="#" target="_blank" rel="noopener">🎵 TikTok</a>
      <a href="#" target="_blank" rel="noopener">📘 Facebook</a>
      <a href="#" target="_blank" rel="noopener">📸 Instagram</a>
      <a href="#" target="_blank" rel="noopener">▶️ YouTube</a>
      <a href="#" target="_blank" rel="noopener">🎮 Gaming / البث</a>
    </section>
    <div class="note">Ammargaming • جميع الروابط في مكان واحد</div>
  </main>
</body>
</html>
